<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAAT Tools</title>
<script src="xlsx-0.20.3.core.min.js"></script>
<style>
:root{--blue:#0066CC;--blue-l:#e8f1fb;--green:#00A651;--green-l:#e6f6ec;--amber:#b7791f;--amber-l:#fdf3e1;--red:#c53030;--red-l:#fdecec;
--ink:#1f2933;--mut:#616e7c;--line:#e4e7eb;--bg:#f5f7fa;--card:#fff;--sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.eng{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.eng input{width:170px}
.wrap{display:flex;min-height:calc(100vh - 57px)}
nav{width:236px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex-shrink:0}
nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:12px 12px 4px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:13.5px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--blue-l);color:var(--blue);font-weight:600}
nav a .n{width:20px;height:20px;border-radius:5px;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--mut);flex-shrink:0}
nav a.on .n{background:var(--blue);color:#fff}
nav a .dot{margin-left:auto;font-size:11px;border-radius:9px;padding:0 7px;background:var(--bg);color:var(--mut)}
nav a .dot.warn{background:var(--amber-l);color:var(--amber)}
nav a .dot.ok{background:var(--green-l);color:var(--green)}
main{flex:1;padding:20px 24px;min-width:0}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);min-width:160px}
input,select,textarea{font:inherit;font-size:13px;padding:6px 9px;border:1px solid #cbd2d9;border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
.btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:6px;border:1px solid #cbd2d9;background:#fff;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#0057ad}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.drop{border:2px dashed #b8c4d0;border-radius:10px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:#fafbfc}
.drop.hv{border-color:var(--blue);background:var(--blue-l)}
.drop b{color:var(--ink)}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--bg);color:var(--mut)}
.chip.ok{background:var(--green-l);color:#08783e}
.chip.warn{background:var(--amber-l);color:var(--amber)}
.chip.bad{background:var(--red-l);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:19px;font-weight:650;margin-top:2px;word-break:break-word}
.kpi.warn{border-left:4px solid var(--amber)}
.kpi.ok{border-left:4px solid var(--green)}
.kpi.bad{border-left:4px solid var(--red)}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff}
th{position:sticky;top:0;background:#f0f3f7;text-align:left;font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.r,td.r{text-align:right}
td{padding:6px 9px;border-bottom:1px solid #f0f2f5;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
tr.ck{cursor:pointer}
tr.ck:hover td{background:#f5f9ff}
tr.sel td{background:#e8f1fb}
.tbar{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.tbar h4{margin:0;font-size:13.5px;margin-right:auto}
.tbar input{width:200px}
.muted{color:var(--mut);font-size:12.5px}
.help{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
.help b{color:var(--ink)}
.help p{margin:4px 0}
.err{background:var(--red-l);color:var(--red);padding:10px 14px;border-radius:8px;margin-bottom:12px}
.note{background:var(--amber-l);color:#7a5212;padding:9px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 16px}
.cols{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:150px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fafbfc}
.cols label{font-size:12.5px;display:flex;gap:5px;align-items:center}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dash .kpi{cursor:pointer}
.dash .kpi:hover{border-color:var(--blue)}
.chart{overflow-x:auto}
.toast{position:fixed;bottom:20px;right:20px;background:#1f2933;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
footer{color:var(--mut);font-size:12px;padding:8px 0 20px}
@media(max-width:820px){.wrap{flex-direction:column}nav{width:auto;display:flex;flex-wrap:wrap;gap:2px}nav .sec{width:100%}.eng{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">∑</div><div>CAAT Tools<small>Data analytics tests for audit · Prototype v0.6</small></div></div>
  <div class="eng">
    <input id="eEnt" placeholder="Entity / client name">
    <input id="ePer" placeholder="Period (e.g. FY 2025-26)">
    <input id="ePrep" placeholder="Prepared by">
    <button class="btn g" id="bExport">Export working papers (.xlsx)</button>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ Utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||n===''||isNaN(n))?'':Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n==null||isNaN(n))?'':Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const pct=x=>(x==null||isNaN(x))?'':(x*100).toFixed(2)+'%';
const dmy=s=>s?s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4):'';
const sumBy=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
function groupBy(arr,f){const m=new Map();for(const x of arr){const k=f(x);let g=m.get(k);if(!g){g=[];m.set(k,g)}g.push(x)}return m}
function quant(sorted,q){const p=(sorted.length-1)*q,b=Math.floor(p),r=p-b;return sorted[b+1]!==undefined?sorted[b]+r*(sorted[b+1]-sorted[b]):sorted[b]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
async function sha256(buf){try{const h=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return 'not available in this browser'}}
const byAmtDesc=(a,b)=>Math.abs(b._amt)-Math.abs(a._amt);

const DISCLAIMER='CAAT Tools is an independent prototype provided “as is” to assist with data analysis. It is not issued, approved or endorsed by any professional or regulatory body. Its results are indicators only: they are not audit evidence or an opinion by themselves. The auditor remains solely responsible for the procedures performed, the judgements made and the conclusions reached under the applicable Standards on Auditing, and should verify every parameter, threshold, statutory limit and sample size before relying on it. No responsibility or liability is accepted for any loss arising from the use of this tool or its results.';
/* ============ Parsing ============ */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const yr=y=>{y=+y;return y<100?(y<50?2000+y:1900+y):y};
function iso(y,m,d){if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>1900&&y<2200))return '';return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}return ''}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return iso(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})\b/))){let a=+m[1],b=+m[2];const f=S.dateFmt==='auto'?(S._dfAuto||'dmy'):S.dateFmt;if(f==='mdy')[a,b]=[b,a];return iso(yr(m[3]),b,a)} // day-first unless told otherwise
  if((m=s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]*(\d{2,4})/))){const mo=MON[m[2].toLowerCase().slice(0,3)];if(mo)return iso(yr(m[3]),mo,+m[1])}
  if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(+s);
  return '';
}
function parseAmount(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  if(v==null)return null;
  let s=String(v).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(S.numFmt==='eu')s=s.replace(/\./g,'').replace(/,/g,'.');
  if(/cr\.?$/i.test(s)&&S.crNeg)neg=!neg;
  s=s.replace(/(dr|cr)\.?$/i,'').replace(/rs\.?|inr|₹|,|\s/gi,'');
  if(s.endsWith('-')){neg=!neg;s=s.slice(0,-1)}
  if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s))return null;
  const n=parseFloat(s);return neg?-n:n;
}

/* ============ State ============ */
const S={fileName:'',hash:'',sheet:'',files:[],parts:[],delim:'auto',headerRow:1,headerRows:1,headers:[],headersPre:[],raw:[],rows:[],
  opt:{skipTotals:true,totalWords:'total, grand total, sub total, subtotal, opening balance, closing balance, carried over, carried forward, brought forward, c/f, b/f',skipRepHdr:true,fill:[],unpivot:[],unpivotName:'Period',srcCol:true},
  amtMode:'single',splitPos:'dr',map:{amount:'',credit:'',drcr:'',party:'',date:'',doc:'',vtype:'',cat:'',desc:'',gstin:'',pan:'',user:''},drcrNeg:'cr',dateFmt:'auto',numFmt:'in',filters:[],
  abs:false,crNeg:false,mapped:false,log:{},view:'data',params:{},results:{},err:{}};
const MAPF=[['amount','Amount',''],['credit','Credit amount',''],['drcr','Dr / Cr column',''],
 ['party','Party / Vendor / Ledger','Needed for RSF, Single transactions and party-wise tests.'],
 ['date','Date',''],['doc','Voucher / Invoice No.','Needed for the sequence gap test.'],['vtype','Voucher type','e.g. Payment, Journal, Sales. Useful for row filters.'],
 ['cat','Category / Expense head',''],['desc','Narration / Description',''],
 ['gstin','GSTIN','For the GSTIN / PAN format check.'],['pan','PAN','For the GSTIN / PAN format check.'],['user','Entered by / User','Who posted the entry, if the export has it.']];
const GUESS_PRI={amount:[/^(invoice|bill|net|gross|total|txn|transaction)?\s*(amount|amt)\.?$/i,/invoice value|bill value|total value|gross value|net value|voucher amount/i,/amount|amt/i,/debit|\bdr\b|total|net|gross|value|taxable/i],
  doc:[/voucher|vch/i,/invoice ?no|inv\.? ?no|bill ?no|doc(ument)? ?no|entry ?no/i,/ref|number|\bno\b/i]};
const GUESS_EXC={amount:/date|balance|\bgst\b|cgst|sgst|igst|cess|tax amount|tds|discount|rate|qty|quantity|%|\bno\b|number/i,doc:/type|date/i,party:/date|amount|gstin|\bpan\b|\bno\.?$|number|invoice|\bcode\b|\bid$|type|group|head|category/i};
const GUESS={amount:/amount|amt|value|debit|\bdr\b|total|net|gross|taxable/i,credit:/credit|\bcr\b/i,drcr:/^(dr\s*\/\s*cr|cr\s*\/\s*dr|drcr|d\s*\/\s*c|dc|debit\s*\/\s*credit|dr or cr|sign)$/i,
  party:/party|vendor|supplier|customer|ledger|name|account|payee|beneficiary|remitter|particulars/i,date:/date|\bdt\b/i,doc:/voucher|vch|invoice|inv\.? ?no|doc|bill|ref|number|\bno\b/i,
  vtype:/vch\.? ?type|voucher ?type|doc(ument)? ?type|txn ?type|transaction ?type|entry ?type/i,user:/user|entered ?by|created ?by|posted ?by|maker/i,
  cat:/head|category|group|type|nature|gl/i,desc:/narration|desc|remark|memo/i,gstin:/gstin|gst ?no|gst ?number|gst ?reg|gst ?id/i,pan:/\bpan\b|pan ?no|pan ?number/i};

/* ============ Load files ============ */
function sniffDelim(t){const lines=t.split(/\r?\n/).filter(l=>l.trim()).slice(0,20);let best=',',bs=-1;
  for(const d of [',',';','\t','|']){const c=lines.map(l=>l.split(d).length-1);const mn=Math.min(...c);const sc=mn>0?mn*10-(Math.max(...c)-mn):0;if(sc>bs){bs=sc;best=d}}return best}
function parseDelimited(t,d){const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==='')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);out.push(row)}return out}
function guessHeaderRow(aoa){let best=0,bi=0;for(let i=0;i<Math.min(25,aoa.length);i++){const c=(aoa[i]||[]).filter(x=>typeof x==='string'&&x.trim()&&parseAmount(x)==null&&!parseDate(x)).length;if(c>best){best=c;bi=i}}return bi+1}
function csvParts(f){const d=S.delim==='auto'?sniffDelim(f.text):S.delim;return[{file:f.name,sheet:'(text)',label:f.name,aoa:parseDelimited(f.text,d),off:0,on:true,fid:f.id,delimUsed:d}]}
async function addFiles(list){
  const first=!S.parts.length;
  for(const f of list){try{
    const buf=await f.arrayBuffer(),hash=await sha256(buf),id=Math.random().toString(36).slice(2,8);
    if(/\.(csv|txt|tsv)$/i.test(f.name)){const text=new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'');const fo={id,name:f.name,hash,kind:'csv',text};S.files.push(fo);S.parts.push(...csvParts(fo))}
    else{const wb=XLSX.read(buf,{type:'array'});S.files.push({id,name:f.name,hash,kind:'xlsx'});
      wb.SheetNames.forEach((sn,i)=>{const ws=wb.Sheets[sn];if(!ws['!ref'])return;S.parts.push({file:f.name,sheet:sn,label:f.name+' › '+sn,aoa:XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:true}),off:XLSX.utils.decode_range(ws['!ref']).s.r,on:i===0,fid:id})})}
    toast('Loaded '+f.name)}catch(e){S.err.data='Could not read '+f.name+': '+e.message}}
  if(first&&S.parts.length)S.headerRow=guessHeaderRow(S.parts[0].aoa);
  buildRows(first)}
function reparseCsv(){S.parts=S.parts.flatMap(p=>{const f=S.files.find(x=>x.id===p.fid);return f&&f.kind==='csv'?csvParts(f).map(n=>Object.assign(n,{on:p.on})):[p]})}
function hdrNames(aoa){const hr=S.headerRow-1,top=(aoa[hr]||[]).map(x=>String(x??'').trim());if(S.headerRows!==2)return top;
  const bot=(aoa[hr+1]||[]).map(x=>String(x??'').trim()),w=Math.max(top.length,bot.length),h=[];let last='';
  for(let j=0;j<w;j++){let t=top[j]||'';if(t)last=t;else if(bot[j])t=last;h.push([t,bot[j]||''].filter(Boolean).join(' ').trim())}return h}
function buildRows(guess){
  const parts=S.parts.filter(p=>p.on),multi=parts.length>1,log={read:0,blank:0,hdr:0,tot:0,filled:0,unpiv:0};
  const words=String(S.opt.totalWords||'').split(',').map(w=>w.trim().toLowerCase()).filter(Boolean);
  const order=[],seenH=new Set(),all=[],start=S.headerRow+S.headerRows-1;
  for(const p of parts){const aoa=p.aoa,raw=hdrNames(aoa);
    const width=Math.max(raw.length,...aoa.slice(start,start+300).map(r=>r.length),0);const seen={},names=[];
    for(let j=0;j<width;j++){let n=raw[j]||('Column '+(j+1));if(seen[n]){seen[n]++;n+=' ('+seen[n]+')'}else seen[n]=1;names.push(n);if(!seenH.has(n)){seenH.add(n);order.push(n)}}
    const hl=names.map(n=>n.toLowerCase()),prev={};
    for(let i=start;i<aoa.length;i++){const a=aoa[i]||[];log.read++;
      if(!a.some(x=>x!==''&&x!=null)){log.blank++;continue}
      if(S.opt.skipRepHdr){const ne=a.map((x,j)=>[String(x??'').trim().toLowerCase(),j]).filter(([x])=>x);if(ne.length>=2&&ne.filter(([x,j])=>x===hl[j]).length>=Math.ceil(ne.length*0.6)){log.hdr++;continue}}
      if(S.opt.skipTotals&&words.length){const fst=a.filter(x=>String(x??'').trim()!=='').slice(0,3).map(x=>String(x).trim().toLowerCase());
        if(fst.some(t=>parseAmount(t)==null&&words.some(w=>t===w||t.startsWith(w+' ')||t.startsWith(w+':')||t.startsWith(w+'.')||t.startsWith(w+'-')))){log.tot++;continue}}
      const o={_xr:p.off+i+1,_src:p.label};
      names.forEach((k,j)=>{let v=a[j]??'';if(S.opt.fill.includes(k)){if(v===''||v==null){if(prev[k]!==undefined&&prev[k]!==''){v=prev[k];log.filled++}}else prev[k]=v}o[k]=v});
      all.push(o)}}
  let headers=order.slice();if(multi&&S.opt.srcCol){headers.push('Source');all.forEach(o=>o.Source=o._src)}
  S.headersPre=headers.slice();
  const up=S.opt.unpivot.filter(c=>headers.includes(c));let rows=all;
  if(up.length){const keep=headers.filter(h=>!up.includes(h)),nm=S.opt.unpivotName||'Period';rows=[];
    for(const o of all)for(const c of up){const v=o[c];if(v===''||v==null)continue;const n={_xr:o._xr,_src:o._src};keep.forEach(k=>n[k]=o[k]);n[nm]=c;n.Value=v;rows.push(n);log.unpiv++}
    headers=[...keep,nm,'Value']}
  rows.forEach((o,i)=>o._r=i+1);
  S.headers=headers;S.raw=rows;S.log=log;S.multi=multi;
  S.fileName=[...new Set(parts.map(p=>p.file))].join(' + ');S.sheet=parts.map(p=>p.sheet).join(', ');S.hash=S.files.filter(f=>parts.some(p=>p.fid===f.id)).map(f=>f.name+': '+f.hash).join(' | ');
  for(const k in S.map)if(S.map[k]&&!headers.includes(S.map[k]))S.map[k]='';
  if(guess){const used=new Set();for(const k in S.map)S.map[k]='';
    for(const k of ['gstin','pan','drcr','vtype','user','date','doc','amount','credit','party','cat','desc']){let hit='';
      for(const pat of (GUESS_PRI[k]||[GUESS[k]])){hit=headers.find(x=>!used.has(x)&&pat.test(x)&&!(GUESS_EXC[k]&&GUESS_EXC[k].test(x)));if(hit)break}
      S.map[k]=hit||'';if(hit)used.add(hit)}
    if(S.map.credit&&!/debit|\bdr\b/i.test(S.map.amount))S.map.credit='';
    if(up.length&&!S.map.amount)S.map.amount='Value';
    S.amtMode=S.map.credit?'split':S.map.drcr?'ind':'single'}

/* ============ GSTIN / PAN helpers ============ */
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function gstCheck(g){let s=0;for(let i=0;i<14;i++){const v=B36.indexOf(g[i]);if(v<0)return '?';const p=v*(i%2?2:1);s+=Math.floor(p/36)+p%36}return B36[(36-s%36)%36]}
const STATES={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','25':'Daman & Diu (legacy)','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','28':'Andhra Pradesh (legacy)','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar Islands','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh','97':'Other Territory','99':'Centre Jurisdiction'};
const PANT={P:'Individual',C:'Company',H:'HUF',F:'Firm / LLP',A:'AOP',T:'Trust',B:'BOI',L:'Local authority',J:'Artificial juridical person',G:'Government'};
const cleanName=n=>String(n||'').toLowerCase().replace(/^(m\/s\.?|messrs\.?|the|shri|smt\.?|mr\.?|mrs\.?|ms\.?|dr\.?)\s+/,'');
const normName=n=>cleanName(n).replace(/\b(private|pvt|limited|ltd|llp|company|co|and|the|corporation|corp)\b|[^a-z0-9]/g,'');
function gstinErrors(g){
  if(!/^[0-9A-Z]{15}$/.test(g))return[[g.length!==15?'Length is '+g.length+' characters (should be 15)':'Contains characters other than A–Z and 0–9','High']];
  const out=[],sc=g.slice(0,2);
  if(!STATES[sc])out.push(['Invalid state code "'+sc+'"','High']);else if(sc==='25'||sc==='28')out.push(['Legacy state code '+sc+' — '+STATES[sc],'Low']);
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))out.push(['Not in the normal taxpayer pattern — may be a TDS/TCS, UIN, NRTP or OIDAR registration; verify on the GST portal','Medium']);
  else if(!PANT[g[5]])out.push(['PAN part of GSTIN has an invalid 4th character "'+g[5]+'"','High']);
  const ck=gstCheck(g);if(ck!==g[14])out.push(['Check digit fails (expected '+ck+', found '+g[14]+') — typing error or non-genuine GSTIN','High']);
  return out}
function panErrors(p,party){
  if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(p))return[['Not a valid PAN pattern (5 letters, 4 digits, 1 letter)','High']];
  if(!PANT[p[3]])return[['Invalid 4th character "'+p[3]+'" (holder type)','High']];
  const out=[];const c=cleanName(party);
  if(p[3]!=='P'&&c&&/[a-z]/.test(c[0])&&c[0].toUpperCase()!==p[4])out.push(['5th character "'+p[4]+'" does not match the first letter of the party name (indicative only)','Low']);
  return out}
const SEV={High:0,Medium:1,Low:2};
const dayNum=s=>Math.round(Date.parse(s+'T00:00:00Z')/864e5);

{id:'rsf',name:'Relative Size Factor',needs:['party'],
 help:'<b>What it finds:</b> for each party, the largest transaction divided by the second largest. A high ratio means one transaction is out of line with that party\'s normal pattern — a possible error, an unusual one-off, a wrong ledger posting or a fraudulent bill.<p><b>How to read:</b> RSF of 10 means the largest item is ten times the next. Look at flagged parties first, then open the transactions (click a row). <b>Useful for:</b> SA 240 (fraud risk), SA 520 (analytical procedures), vendor and customer ledger review.</p>',
 params:[{id:'thr',l:'Flag when RSF is at least',t:'num',d:10},{id:'minN',l:'Minimum transactions per party',t:'num',d:2},{id:'only',l:'Show flagged parties only',t:'bool',d:false}],
 run(p){const out=[];
  for(const [k,arr] of groupBy(valid().filter(r=>r._party),r=>r._party)){if(arr.length<Math.max(2,p.minN))continue;
    const v=arr.map(r=>Math.abs(r._amt)).sort((a,b)=>b-a),l=v[0],s=v[1];const rsf=s>0?l/s:(l>0?Infinity:0);
    out.push({party:k,n:arr.length,total:sumBy(arr,r=>r._amt),largest:l,second:s,rsf,flag:rsf>=p.thr?'Flag':'',_rows:arr})}
  out.sort((a,b)=>b.rsf-a.rsf);const fl=out.filter(x=>x.flag);
  return{flag:fl.length,cards:[['Parties analysed',fmt0(out.length)],['Parties flagged (RSF ≥ '+p.thr+')',fmt0(fl.length),fl.length?'warn':'ok'],['Largest items of flagged parties',fmt(sumBy(fl,x=>x.largest))]],
   tables:[{title:'Relative Size Factor by party',cols:[{k:'party',h:'Party'},{k:'n',h:'Txns',t:'int'},{k:'total',h:'Total value',t:'amt'},{k:'largest',h:'Largest',t:'amt'},{k:'second',h:'2nd largest',t:'amt'},{k:'rsf',h:'RSF',t:'num'},{k:'flag',h:'Result'}],
    rows:p.only?fl:out,drill:x=>({title:'Transactions — '+x.party,rows:x._rows.slice().sort(byAmtDesc)})}]}}},

{id:'gaps',name:'Check missing',needs:[],
 help:'<b>What it finds:</b> (1) gaps in a voucher or invoice number series — numbers that should exist but are absent from the data; (2) duplicate numbers in the series; (3) blank cells in every column.<p><b>How to read:</b> each gap needs an explanation — cancelled voucher, voided invoice, or an entry kept out of the books. Series are split by prefix (e.g. PV/25-26/ and JV/25-26/ are checked separately). <b>Useful for:</b> completeness assertion (SA 315), GST invoice-series review, SA 240.</p>',
 params:[{id:'col',l:'Document number column',t:'col',d:()=>S.map.doc},{id:'byPrefix',l:'Treat each prefix as a separate series',t:'bool',d:true},{id:'maxGap',l:'Gaps larger than this are a series break, not missing',t:'num',d:500}],
 run(p){if(!p.col)throw new Error('Select the document number column.');
  const ser=new Map();let blank=0,bad=0;
  for(const r of S.rows){const v=String(r[p.col]??'').trim();if(!v){blank++;continue}const m=v.match(/^(.*?)(\d+)(\D*)$/);if(!m){bad++;continue}
    const key=p.byPrefix?m[1]+'#'+m[3]:'(all numbers)';let s=ser.get(key);if(!s){s={nums:new Map(),w:0,lead:false,pre:m[1],suf:m[3]};ser.set(key,s)}
    const n=parseInt(m[2],10);s.nums.set(n,(s.nums.get(n)||0)+1);s.w=Math.max(s.w,m[2].length);if(m[2].length>1&&m[2][0]==='0')s.lead=true}
  const sumR=[],gapR=[],dupR=[];let tm=0,td=0;

    const ns=[...s.nums.keys()].sort((a,b)=>a-b);let miss=0,dup=0,br=0,cnt=0;
    for(const [n,c] of s.nums){cnt+=c;if(c>1){dup+=c-1;dupR.push({series:k,no:lab(n),times:c})}}
    for(let i=1;i<ns.length;i++){const d=ns[i]-ns[i-1]-1;if(d>0){if(d>p.maxGap){br++;continue}miss+=d;gapR.push({series:k,from:lab(ns[i-1]+1),to:lab(ns[i]-1),count:d})}}
    tm+=miss;td+=dup;sumR.push({series:k,count:cnt,first:lab(ns[0]),last:lab(ns[ns.length-1]),missing:miss,dups:dup,breaks:br})}
  sumR.sort((a,b)=>b.count-a.count);
  const blk=S.headers.map(h=>{const b=S.rows.filter(r=>String(r[h]??'').trim()==='').length;return{col:h,blank:b,p:S.rows.length?b/S.rows.length:0}}).sort((a,b)=>b.blank-a.blank);
  const cards=[['Series found',fmt0(ser.size)],['Missing numbers',fmt0(tm),tm?'warn':'ok'],['Duplicate numbers',fmt0(td),td?'warn':'ok'],['Blank / unreadable doc nos.',fmt0(blank)+' / '+fmt0(bad),blank||bad?'warn':'ok']];
  return{flag:tm+td,cards,tables:[
   {title:'Series summary',cols:[{k:'series',h:'Series (# = number)'},{k:'count',h:'Documents',t:'int'},{k:'first',h:'First'},{k:'last',h:'Last'},{k:'missing',h:'Missing',t:'int'},{k:'dups',h:'Duplicates',t:'int'},{k:'breaks',h:'Series breaks',t:'int'}],rows:sumR},
   {title:'Missing numbers (gaps)',cols:[{k:'series',h:'Series'},{k:'from',h:'Missing from'},{k:'to',h:'Missing to'},{k:'count',h:'Count',t:'int'}],rows:gapR},
   {title:'Duplicate document numbers',cols:[{k:'series',h:'Series'},{k:'no',h:'Document no.'},{k:'times',h:'Times used',t:'int'}],rows:dupR,

   {title:'Blank cells by column',cols:[{k:'col',h:'Column'},{k:'blank',h:'Blank cells',t:'int'},{k:'p',h:'% of rows',t:'pct'}],rows:blk}]}}},

{id:'dups',name:'Check duplicates',needs:[],
 help:'<b>What it finds:</b> rows that share the same values in the columns you choose. Pick the columns that define a duplicate for your data — for example the same party, amount and date with a different voucher number is a classic duplicate payment.<p><b>How to read:</b> every group of two or more rows is listed together. "Excess value" is the value of the second and later rows in each group — the amount at risk if they are true duplicates. <b>Useful for:</b> duplicate payments, double booking of sales or purchase invoices, SA 240.</p>',
 params:[{id:'keys',l:'Columns that must match',t:'cols',d:()=>[S.map.party,S.map.amount,S.map.date].filter(Boolean)}],

 help:'<b>What it finds:</b> amounts that are exact multiples of ₹100, ₹1,000, ₹10,000, ₹1 lakh and so on. Genuine invoices carry taxes, freight and odd paisa; round figures often point to estimates, provisions, manual adjustments, advances or invented entries.<p><b>How to read:</b> compare the share of round amounts with what you would expect for this kind of ledger, and look hardest at large round items near the year end. <b>Useful for:</b> journal entry testing under SA 240, review of provisions and estimates.</p>',
 params:[{id:'unit',l:'Smallest round unit to flag',t:'sel',d:'1000',o:[['100','₹100'],['1000','₹1,000'],['10000','₹10,000'],['100000','₹1 lakh']]},{id:'min',l:'Ignore amounts below',t:'num',d:1000}],
 run(p){const levels=[10000000,1000000,100000,10000,1000,100].filter(l=>l>=+p.unit);let el=0,elv=0;const fl=[];
  for(const r of valid()){const a=Math.abs(r._amt);if(a<p.min)continue;el++;elv+=a;if(Math.abs(a-Math.round(a))>0.004)continue;const ai=Math.round(a);const lv=levels.find(l=>ai%l===0);if(lv)fl.push(Object.assign({},r,{_lv:LV(lv),_lvn:lv}))}
  fl.sort(byAmtDesc);const fv=sumBy(fl,r=>Math.abs(r._amt));
  const lvT=levels.map(l=>{const a=fl.filter(r=>r._lvn===l);return{lv:LV(l),n:a.length,pn:el?a.length/el:0,v:sumBy(a,r=>Math.abs(r._amt)),pv:elv?sumBy(a,r=>Math.abs(r._amt))/elv:0,_rows:a}});
  return{flag:fl.length,cards:[['Transactions tested',fmt0(el)],['Round amounts',fmt0(fl.length),fl.length?'warn':'ok'],['Share of transactions',pct(el?fl.length/el:0)],['Value of round amounts',fmt(fv)]],
   tables:[{title:'By level of roundness (each item counted once, at its highest level)',cols:[{k:'lv',h:'Level'},{k:'n',h:'Count',t:'int'},{k:'pn',h:'% of count',t:'pct'},{k:'v',h:'Value',t:'amt'},{k:'pv',h:'% of value',t:'pct'}],rows:lvT,noSort:true,drill:x=>({title:x.lv,rows:x._rows})},
    {title:'Round-amount transactions',cols:[{k:'_lv',h:'Level'},...txnCols()],rows:fl}]}}},

{id:'odd',name:'Repetitive odd numbers',needs:[],
 help:'<b>What it finds:</b> the same non-round amount appearing again and again — for example ₹49,950 or ₹9,999 several times. Repeated odd amounts can signal splitting of bills to stay under an approval limit, recurring fictitious claims, or a copied invoice.<p><b>How to read:</b> genuine repeats (rent, retainers, EMIs) are easy to explain; amounts just below an approval or TDS threshold deserve a closer look. Click a row to see every occurrence. <b>Useful for:</b> SA 240, expense and purchase review, limit-avoidance checks.</p>',
 params:[{id:'freq',l:'Flag amounts occurring at least',t:'num',d:3},{id:'excl',l:'Treat as round (exclude) multiples of',t:'sel',d:'100',o:[['10','₹10'],['100','₹100'],['1000','₹1,000']]},{id:'min',l:'Ignore amounts below',t:'num',d:500},{id:'byParty',l:'Count repeats within the same party only',t:'bool',d:false}],
 run(p){const g=new Map();const ex=Math.round(+p.excl*100);
  for(const r of valid()){const a=Math.abs(r._amt);if(a<p.min)continue;const c=Math.round(a*100);if(c%ex===0)continue;const k=(p.byParty?r._party+'\u0001':'')+c;let x=g.get(k);if(!x){x=[];g.set(k,x)}x.push(r)}
  const out=[];for(const [k,arr] of g){if(arr.length<p.freq)continue;const ps=[...new Set(arr.map(r=>r._party).filter(Boolean))];
    out.push({amt:Math.abs(arr[0]._amt),n:arr.length,tot:sumBy(arr,r=>Math.abs(r._amt)),np:ps.length,names:ps.slice(0,3).join('; ')+(ps.length>3?' …':''),_rows:arr})}
  out.sort((a,b)=>b.n-a.n||b.amt-a.amt);
  return{flag:out.length,cards:[['Repeated odd amounts',fmt0(out.length),out.length?'warn':'ok'],['Transactions involved',fmt0(sumBy(out,x=>x.n))],['Value involved',fmt(sumBy(out,x=>x.tot))]],
   tables:[{title:'Amounts repeated '+p.freq+' or more times',cols:[{k:'amt',h:'Amount',t:'amt'},{k:'n',h:'Occurrences',t:'int'},{k:'tot',h:'Total value',t:'amt'},{k:'np',h:'Parties',t:'int'},{k:'names',h:'Party names'}],rows:out,drill:x=>({title:'Occurrences of '+fmt(x.amt),rows:x._rows})}]}}},

{id:'strat',name:'Classification & Stratification',needs:[],
 help:'<b>What it shows:</b> how the population is spread across value bands (strata), across categories (expense head, ledger group) and across months. It tells you where the value sits and where the volume sits.<p><b>How to read:</b> a few high-value items often carry most of the value — test them in full and sample the rest. Months or categories that stand out need an explanation. <b>Useful for:</b> planning and stratified sampling under SA 530, analytical procedures under SA 520, cut-off review.</p>',
 params:[{id:'b',l:'Band limits (comma separated)',t:'text',d:'10000, 50000, 100000, 500000, 1000000, 5000000'}],
 run(p){const V=valid();const b=String(p.b).split(/[,;\s]+/).map(x=>parseAmount(x)).filter(x=>x!=null&&x>0).sort((a,c)=>a-c);
  const tv=sumBy(V,r=>Math.abs(r._amt)),tn=V.length;const bands=[];
  if(V.some(r=>r._amt<0))bands.push({lab:'Negative (below 0)',f:a=>a<0});
  const lims=[0,...b];lims.forEach((lo,i)=>{const hi=lims[i+1];bands.push({lab:hi!=null?fmt0(lo)+' to below '+fmt0(hi):fmt0(lo)+' and above',f:a=>a>=lo&&(hi==null||a<hi)})});
  const agg=(lab,arr)=>{const v=arr.map(r=>r._amt);return{lab,n:arr.length,pn:tn?arr.length/tn:0,v:sumBy(v,x=>x),pv:tv?sumBy(v,x=>Math.abs(x))/tv:0,min:arr.length?v.reduce((a,b)=>b<a?b:a,Infinity):null,max:arr.length?v.reduce((a,b)=>b>a?b:a,-Infinity):null,avg:arr.length?sumBy(v,x=>x)/arr.length:null,_rows:arr}};
  const st=bands.map(bd=>agg(bd.lab,V.filter(r=>bd.f(r._amt))));
  const cols=[{k:'lab',h:'Stratum'},{k:'n',h:'Count',t:'int'},{k:'pn',h:'% count',t:'pct'},{k:'v',h:'Value',t:'amt'},{k:'pv',h:'% value',t:'pct'},{k:'min',h:'Min',t:'amt'},{k:'max',h:'Max',t:'amt'},{k:'avg',h:'Average',t:'amt'}];
  const dr=x=>({title:x.lab,rows:x._rows.slice().sort(byAmtDesc)});
  const tables=[{title:'Stratification by value',cols,rows:st,noSort:true,drill:dr}];
  const ck=S.map.cat?'_cat':(S.map.party?'_party':null);
  if(ck){const c=[...groupBy(V,r=>r[ck]||'(blank)')].map(([k,a])=>agg(k,a)).sort((x,y)=>Math.abs(y.v)-Math.abs(x.v));
    const cc=cols.slice();cc[0]={k:'lab',h:S.map.cat?'Category':'Party'};tables.push({title:'Classification by '+(S.map.cat||S.map.party),cols:cc,rows:c,drill:dr})}
  if(S.map.date){const mm=[...groupBy(V.filter(r=>r._date),r=>r._date.slice(0,7))].sort((a,c)=>a[0]<c[0]?-1:1).map(([k,a])=>agg(new Date(k+'-01T00:00:00').toLocaleString('en-IN',{month:'short',year:'numeric'}),a));
    const cm=cols.slice();cm[0]={k:'lab',h:'Month'};tables.push({title:'Monthly distribution',cols:cm,rows:mm,noSort:true,drill:dr})}
  const top=st.filter(x=>x.n).sort((a,c)=>c.pv-a.pv)[0];
  return{flag:null,cards:[['Transactions',fmt0(tn)],['Total value (absolute)',fmt(tv)],['Strata',fmt0(bands.length)],['Value concentrated in',top?top.lab+' ('+pct(top.pv)+')':'—']],
   chart:barChart({labels:st.map(x=>x.lab.replace(' to below ','–').replace(' and above','+').replace('Negative (below 0)','<0')),series:[{name:'% of count',vals:st.map(x=>x.pn*100),c:'#00A651'},{name:'% of value',vals:st.map(x=>x.pv*100),c:'#0066CC'}],y:'%'}),tables}}},

{id:'single',name:'Single transactions',needs:['party'],
 help:'<b>What it finds:</b> parties with only one transaction in the whole period — one-time vendors, customers or ledgers. Fictitious vendors, accommodation entries and wrongly named accounts often show up this way.<p><b>How to read:</b> start with the largest single items. Check that the party exists (GSTIN, PAN, bank details), that goods or services were received, and that approval was proper. <b>Useful for:</b> vendor master review, SA 240, SA 550 (related parties).</p>',
 params:[{id:'min',l:'Ignore amounts below',t:'num',d:0}],
 run(p){const V=valid().filter(r=>r._party);const g=groupBy(V,r=>r._party);const out=[];for(const a of g.values())if(a.length===1&&Math.abs(a[0]._amt)>=p.min)out.push(a[0]);
  out.sort(byAmtDesc);const tv=sumBy(V,r=>Math.abs(r._amt)),sv=sumBy(out,r=>Math.abs(r._amt));
  return{flag:out.length,cards:[['Parties in data',fmt0(g.size)],['Single-transaction parties',fmt0(out.length),out.length?'warn':'ok'],['Their value',fmt(sv)],['Share of total value',pct(tv?sv/tv:0)]],
   tables:[{title:'Parties with a single transaction',cols:txnCols(),rows:out}]}}},

{id:'outlier',name:'Isolated outliers',needs:[],
 help:'<b>What it finds:</b> transactions far away from the normal range — either overall, or within their own party or category (a ₹5 lakh bill is normal for steel but odd for stationery).<p><b>Methods:</b> <b>Z-score</b> measures distance from the average in standard deviations (3 is a common cut-off). <b>IQR</b> measures distance beyond the middle 50% of values (1.5 = mild, 3 = extreme) and is less disturbed by the outliers themselves. <b>Useful for:</b> key-item selection under SA 530, analytical procedures under SA 520.</p>',
 params:[{id:'method',l:'Method',t:'sel',d:'iqr',o:[['iqr','IQR (robust)'],['z','Z-score']]},{id:'k',l:'Cut-off (Z: SDs, IQR: multiples)',t:'num',d:3},{id:'scope',l:'Compare each item with',t:'sel',d:'cat',o:[['all','Whole population'],['cat','Its category'],['party','Its party']]},{id:'minG',l:'Minimum items in a group',t:'num',d:8}],
 run(p){const sc=p.scope==='cat'&&!S.map.cat?(S.map.party?'party':'all'):(p.scope==='party'&&!S.map.party?'all':p.scope);
  const key=sc==='all'?()=> 'All':sc==='cat'?r=>r._cat||'(blank)':r=>r._party||'(blank)';
  const out=[];let tested=0,ng=0,skip=0;
  for(const [k,arr] of groupBy(valid(),key)){if(arr.length<p.minG){skip++;continue}ng++;tested+=arr.length;const v=arr.map(r=>r._amt);
    if(p.method==='z'){const mu=sumBy(v,x=>x)/v.length;const sd=Math.sqrt(sumBy(v,x=>(x-mu)**2)/(v.length-1));if(!sd)continue;
      for(const r of arr){const z=(r._amt-mu)/sd;if(Math.abs(z)>=p.k)out.push(Object.assign({},r,{_g:k,_c:mu,_s:sd,_sc:z,_d:z>0?'High':'Low'}))}}
    else{const s=v.slice().sort((a,b)=>a-b);const q1=quant(s,.25),q3=quant(s,.75),iq=q3-q1,med=quant(s,.5);if(!iq)continue;
      for(const r of arr){const x=r._amt;const sc=x>q3?(x-q3)/iq:x<q1?(x-q1)/iq:0;if(Math.abs(sc)>=p.k)out.push(Object.assign({},r,{_g:k,_c:med,_s:iq,_sc:sc,_d:sc>0?'High':'Low'}))}}}
  out.sort((a,b)=>Math.abs(b._sc)-Math.abs(a._sc));
  const z=p.method==='z';
  return{flag:out.length,cards:[['Groups analysed',fmt0(ng)+(skip?' ('+skip+' too small)':'')],['Items tested',fmt0(tested)],['Outliers',fmt0(out.length),out.length?'warn':'ok'],['Value of outliers',fmt(sumBy(out,r=>Math.abs(r._amt)))]],
   tables:[{title:'Isolated outliers ('+(z?'Z-score':'IQR')+', compared with '+({all:'whole population',cat:'category',party:'party'})[sc]+')',
    cols:[{k:'_g',h:'Group'},{k:'_d',h:'Side'},{k:'_sc',h:z?'Z-score':'IQRs beyond',t:'num'},{k:'_c',h:z?'Group mean':'Group median',t:'amt'},{k:'_s',h:z?'Std deviation':'IQR',t:'amt'},...txnCols()],rows:out}]}}},

{id:'benford',name:"Benford's Law",needs:[],
 help:'<b>What it tests:</b> in many natural financial populations, the leading digit 1 appears about 30% of the time and 9 under 5%. Invented or manipulated figures usually break this pattern. The tool compares actual digit frequencies with Benford\'s expected frequencies.<p><b>How to read:</b> MAD (mean absolute deviation) gives the overall verdict using Nigrini\'s conformity ranges. Digits marked "Spike" occur significantly more often than expected (Z above 1.96) — click them to list the transactions. <b>Caution:</b> works best with 1,000+ naturally arising amounts; not suitable for assigned numbers, fixed fees, or data with built-in limits. <b>Useful for:</b> SA 240, journal entry testing, expense claims.</p>',
 params:[{id:'test',l:'Test',t:'sel',d:'first',o:[['first','First digit'],['second','Second digit'],['two','First two digits']]},{id:'sign',l:'Amounts to include',t:'sel',d:'pos',o:[['pos','Positive amounts'],['neg','Negative amounts'],['abs','Both (absolute)']]},{id:'min',l:'Ignore amounts below',t:'num',d:10}],
 run(p){const B=BEN[p.test];const pop=S.rows.filter(r=>{const a=r._sAmt;if(a==null||a===0)return false;if(p.sign==='pos'&&a<0)return false;if(p.sign==='neg'&&a>0)return false;return Math.abs(a)>=Math.max(p.min,p.test==='first'?1:10)});
  const N=pop.length;if(!N)throw new Error('No amounts left to test with these settings.');
  const cnt=new Map(B.dom.map(d=>[d,[]]));for(const r of pop)cnt.get(digitOf(r._sAmt,p.test))?.push(r);
  let chi=0,mad=0;const rows=B.dom.map(d=>{const c=cnt.get(d).length,po=c/N,pe=B.exp(d),df=po-pe;const cc=1/(2*N);const zz=(Math.abs(df)>cc?Math.abs(df)-cc:Math.abs(df))/Math.sqrt(pe*(1-pe)/N);
    chi+=(c-N*pe)**2/(N*pe);mad+=Math.abs(df);return{d,c,po,pe,df,z:zz,flag:zz>1.96?(df>0?'Spike':'Short'):'',_rows:cnt.get(d)}});
  mad/=B.dom.length;const [a1,a2,a3]=B.mad;const conf=mad<=a1?['Close conformity','ok']:mad<=a2?['Acceptable conformity','ok']:mad<=a3?['Marginal conformity','warn']:['Nonconformity','bad'];
  const spikes=rows.filter(r=>r.flag==='Spike');
  const res={flag:conf[1]==='ok'?0:spikes.length||1,cards:[['Amounts tested',fmt0(N),N<500?'warn':''],['MAD',mad.toFixed(4)],['Verdict (Nigrini MAD)',conf[0],conf[1]],['Chi-square (5% critical)',chi.toFixed(2)+' ('+B.chi+')',chi>B.chi?'warn':'ok'],['Digits with spikes',spikes.length?spikes.map(r=>r.d).join(', '):'None',spikes.length?'warn':'ok']],
   chart:barChart({labels:B.dom.map(String),series:[{name:'Actual %',vals:rows.map(r=>r.po*100),c:'#0066CC'}],line:{name:'Benford expected %',vals:rows.map(r=>r.pe*100),c:'#E8590C'},y:'%'}),
   tables:[{title:B.lab+' test — click a digit to see its transactions',cols:[{k:'d',h:'Digit',t:'int'},{k:'c',h:'Count',t:'int'},{k:'po',h:'Actual %',t:'pct'},{k:'pe',h:'Expected %',t:'pct'},{k:'df',h:'Difference',t:'pct'},{k:'z',h:'Z-statistic',t:'num'},{k:'flag',h:'Result'}],rows,noSort:true,
    drill:x=>({title:'Amounts with '+B.lab.toLowerCase()+' '+x.d,rows:x._rows.slice().sort(byAmtDesc)})}],
   notes:[]};
  if(N<500)res.notes.push('Only '+fmt0(N)+' amounts are being tested. Benford results are reliable mainly for larger populations (1,000+). Treat the verdict as indicative.');
  if(chi>B.chi&&N>5000)res.notes.push('With large data sets the chi-square test rejects conformity very easily; rely more on MAD.');
  return res}},

{id:'idchk',name:'GSTIN / PAN format check',needs:[],needsAny:['gstin','pan'],
 help:'<b>What it finds:</b> GSTINs and PANs in the data that cannot be genuine or do not agree with each other — wrong length, invalid state code, wrong holder-type character, a failed GSTIN check digit, a PAN that differs from the PAN inside the GSTIN, and one GSTIN or PAN used for different party names.<p><b>How to read:</b> "High" items need action — confirm the registration on the GST portal or the income-tax e-filing portal and correct the master. A failed check digit almost always means a typing error or a made-up number. Shared GSTINs across different names can point to fictitious vendors. <b>Useful for:</b> input tax credit risk, vendor master review, TDS compliance, SA 240 and SA 550.</p>',
 params:[{id:'low',l:'Show low-severity (indicative) items',t:'bool',d:true}],
 run(p){const m=S.map,R=S.rows,iss=[];const gM=new Map(),pM=new Map();let gB=0,pB=0;
  for(const r of R){if(m.gstin){if(!r._gstin)gB++;else{let a=gM.get(r._gstin);if(!a){a=[];gM.set(r._gstin,a)}a.push(r)}}
    if(m.pan){if(!r._pan)pB++;else{let a=pM.get(r._pan);if(!a){a=[];pM.set(r._pan,a)}a.push(r)}}}
  const names=rows=>[...new Set(rows.map(r=>r._party).filter(Boolean))];
  const add=(type,id,rows,issue,sev)=>{const nm=names(rows);iss.push({type,id,party:nm.slice(0,3).join('; ')+(nm.length>3?' …':''),issue,sev,n:rows.length,_rows:rows})};
  let gBad=0,pBad=0;
  for(const [g,rows] of gM){const e=gstinErrors(g);if(e.some(x=>x[1]==='High'))gBad++;e.forEach(x=>add('GSTIN',g,rows,x[0],x[1]));
    if(m.pan&&g.length===15)for(const pn of new Set(rows.map(r=>r._pan).filter(Boolean)))if(pn!==g.slice(2,12))add('GSTIN',g,rows.filter(r=>r._pan===pn),'PAN inside GSTIN ('+g.slice(2,12)+') differs from PAN column ('+pn+')','High');
    if(m.party){const nn=new Set(rows.map(r=>normName(r._party)).filter(Boolean));if(nn.size>1)add('GSTIN',g,rows,'Same GSTIN used for '+nn.size+' different party names','High')}}
  for(const [pn,rows] of pM){const e=panErrors(pn,rows[0]._party);if(e.some(x=>x[1]==='High'))pBad++;e.forEach(x=>add('PAN',pn,rows,x[0],x[1]));
    if(m.party){const nn=new Set(rows.map(r=>normName(r._party)).filter(Boolean));if(nn.size>1)add('PAN',pn,rows,'Same PAN used for '+nn.size+' different party names','Medium')}}
  if(m.party&&m.gstin)for(const [pt,rows] of groupBy(R.filter(r=>r._party&&r._gstin),r=>normName(r._party))){const gs=new Set(rows.map(r=>r._gstin));if(gs.size>1)add('Party',rows[0]._party,rows,'Party has '+gs.size+' GSTINs — confirm they are separate state registrations of the same PAN','Low')}
  let blankParties=[];if(m.party&&m.gstin){for(const [pt,rows] of groupBy(R.filter(r=>r._party),r=>r._party))if(rows.every(r=>!r._gstin))blankParties.push({party:pt,n:rows.length,v:sumBy(rows,r=>Math.abs(r._amt||0)),_rows:rows});blankParties.sort((a,b)=>b.v-a.v)}
  const shown=iss.filter(x=>p.low||x.sev!=='Low').sort((a,b)=>SEV[a.sev]-SEV[b.sev]||b.n-a.n);
  const hi=iss.filter(x=>x.sev==='High').length,md=iss.filter(x=>x.sev==='Medium').length;
  const cards=[];if(m.gstin)cards.push(['Unique GSTINs (invalid)',fmt0(gM.size)+' ('+fmt0(gBad)+')',gBad?'bad':'ok'],['Rows without GSTIN',fmt0(gB),gB?'warn':'ok']);
  if(m.pan)cards.push(['Unique PANs (invalid)',fmt0(pM.size)+' ('+fmt0(pBad)+')',pBad?'bad':'ok']);
  cards.push(['High / medium issues',fmt0(hi)+' / '+fmt0(md),hi?'bad':md?'warn':'ok']);
  const tables=[{title:'Exceptions (click to see the rows)',cols:[{k:'sev',h:'Severity'},{k:'type',h:'Type'},{k:'id',h:'GSTIN / PAN / Party'},{k:'party',h:'Party name(s)'},{k:'issue',h:'Issue'},{k:'n',h:'Rows',t:'int'}],rows:shown,drill:x=>({title:x.id,rows:x._rows})}];
  if(blankParties.length)tables.push({title:'Parties with no GSTIN in any row (check if unregistered, composition or exempt)',cols:[{k:'party',h:'Party'},{k:'n',h:'Txns',t:'int'},{k:'v',h:'Value',t:'amt'}],rows:blankParties,drill:x=>({title:x.party,rows:x._rows})});
  if(m.gstin){const st=[...groupBy([...gM.keys()],g=>g.slice(0,2))].map(([c,a])=>({c,s:STATES[c]||'Invalid code',n:a.length})).sort((a,b)=>b.n-a.n);tables.push({title:'GSTINs by state',cols:[{k:'c',h:'Code'},{k:'s',h:'State / UT'},{k:'n',h:'GSTINs',t:'int'}],rows:st})}
  const panSrc=m.pan?[...pM.keys()]:[...gM.keys()].filter(g=>g.length===15).map(g=>g.slice(2,12));
  const ty=[...groupBy(panSrc,x=>x[3])].map(([c,a])=>({c,s:PANT[c]||'Invalid',n:a.length})).sort((a,b)=>b.n-a.n);
  tables.push({title:'PAN holder types (4th character)',cols:[{k:'c',h:'Code'},{k:'s',h:'Holder type'},{k:'n',h:'Count',t:'int'}],rows:ty});
  return{flag:hi+md,cards,tables}}},

{id:'thresh',name:'Entries just under a threshold',needs:[],
 help:'<b>What it finds:</b> (1) amounts sitting just below a limit — for example ₹49,500 to ₹49,999 against a ₹50,000 approval limit; (2) a "cliff" where many items fall just below a limit but few just above it; (3) possible splitting — two or more items to the same party within a few days, each below the limit but together crossing it.<p><b>Which limits:</b> enter the limits that matter for the entity and the period — internal approval or delegation limits, purchase-committee limits, cash payment and cash receipt limits under the Income-tax law, the e-way bill value, TDS thresholds. Check the current statutory figures before relying on them. <b>Useful for:</b> SA 240 (management override, bill splitting), SA 330 tests of controls, tax compliance reviews.</p>',
 params:[{id:'th',l:'Limits to test (comma separated)',t:'text',d:'10000, 50000, 100000, 200000, 500000'},{id:'band',l:'"Just below" means within (%)',t:'num',d:5},{id:'split',l:'Look for split transactions',t:'bool',d:true},{id:'win',l:'Split window (days; 0 = same day)',t:'num',d:0},{id:'part',l:'In split check, ignore items below (% of limit)',t:'num',d:40}],
 run(p){const T=[...new Set(String(p.th).split(/[,;\s]+/).map(x=>parseAmount(x)).filter(x=>x>0))].sort((a,b)=>b-a);if(!T.length)throw new Error('Enter at least one limit.');
  const band=Math.min(Math.max(+p.band||5,0.1),50)/100,V=valid();const sumT=[],below=[],splits=[],used=new Set();const notes=[];
  for(const t of T){const lo=t*(1-band),hi=t*(1+band);
    const bl=V.filter(r=>{const a=Math.abs(r._amt);return a>=lo&&a<t}),ab=V.filter(r=>{const a=Math.abs(r._amt);return a>=t&&a<hi});
    const ratio=ab.length?bl.length/ab.length:(bl.length?Infinity:null);
    sumT.push({t,nb:bl.length,na:ab.length,ratio,vb:sumBy(bl,r=>Math.abs(r._amt)),flag:bl.length>=3&&(ratio===Infinity||ratio>=2)?'Flag':'',_rows:bl});
    bl.forEach(r=>below.push(Object.assign({},r,{_t:t,_gap:t-Math.abs(r._amt)})));
    if(p.split&&S.map.party&&S.map.date){
      const cand=V.filter(r=>r._party&&r._date&&Math.abs(r._amt)<t&&Math.abs(r._amt)>=t*(+p.part||0)/100&&!used.has(r));
      for(const [pt,arr] of groupBy(cand,r=>r._party)){if(arr.length<2)continue;arr.sort((a,b)=>a._date<b._date?-1:a._date>b._date?1:0);
        let i=0;while(i<arr.length){const d0=dayNum(arr[i]._date);let j=i,s=0;const cl=[];while(j<arr.length&&dayNum(arr[j]._date)-d0<=p.win){cl.push(arr[j]);s+=Math.abs(arr[j]._amt);j++}
          if(cl.length>=2&&s>=t){cl.forEach(r=>used.add(r));splits.push({t,party:pt,from:cl[0]._date,to:cl[cl.length-1]._date,n:cl.length,tot:s,mp:cl.reduce((a,r)=>Math.min(a,Math.abs(r._amt)),Infinity)/t,_rows:cl});i=j}else i++}}}}
  if(p.split&&!(S.map.party&&S.map.date))notes.push('Split-transaction check needs both the Party and Date columns mapped.');
  below.sort((a,b)=>a._gap/a._t-b._gap/b._t);splits.sort((a,b)=>b.mp-a.mp);
  const fl=sumT.filter(x=>x.flag).length;
  return{flag:fl+splits.length,notes,cards:[['Limits tested',T.map(fmt0).join(', ')],['Items just below a limit',fmt0(below.length),below.length?'warn':'ok'],['Limits showing a "cliff"',fmt0(fl),fl?'warn':'ok'],['Possible split transactions',fmt0(splits.length),splits.length?'bad':'ok']],
   tables:[{title:'Limit-wise profile (within '+(band*100)+'% below and above each limit)',cols:[{k:'t',h:'Limit',t:'amt'},{k:'nb',h:'Just below',t:'int'},{k:'na',h:'Just above',t:'int'},{k:'ratio',h:'Below ÷ above',t:'num'},{k:'vb',h:'Value just below',t:'amt'},{k:'flag',h:'Result'}],rows:sumT,noSort:true,drill:x=>({title:'Just below '+fmt(x.t),rows:x._rows.slice().sort(byAmtDesc)})},

/* ============ Chart (SVG) ============ */
function barChart({labels,series,line,y}){
  const W=Math.max(720,labels.length*14+80),H=270,L=48,R=12,Tp=28,Bt=labels.length>12?62:44;const n=labels.length;
  const all=[...series.flatMap(s=>s.vals),...(line?line.vals:[])];const mx=Math.max(...all,1)*1.12;
  const gw=(W-L-R)/n,bw=gw*0.72/series.length;const yy=v=>Tp+(H-Tp-Bt)*(1-v/mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,720)}px;font:11px Segoe UI,system-ui,sans-serif">`;
  for(let i=0;i<=4;i++){const v=mx*i/4,yv=yy(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yv}" y2="${yv}" stroke="#e4e7eb"/><text x="${L-6}" y="${yv+4}" text-anchor="end" fill="#616e7c">${v.toFixed(v<10?1:0)}${y||''}</text>`}
  const every=n>40?5:1;
  labels.forEach((lb,i)=>{const x0=L+gw*i+gw*0.14;series.forEach((se,j)=>{const v=se.vals[i]||0;s+=`<rect x="${x0+j*bw}" y="${yy(v)}" width="${Math.max(1,bw-1)}" height="${H-Bt-yy(v)}" fill="${se.c}" rx="1.5"><title>${esc(lb)}: ${v.toFixed(2)}${y||''}</title></rect>`});
    if(i%every===0){const cx=L+gw*i+gw/2;s+=labels.length>12&&n<=40?`<text transform="translate(${cx},${H-Bt+12}) rotate(-35)" text-anchor="end" fill="#3e4c59">${esc(lb)}</text>`:`<text x="${cx}" y="${H-Bt+15}" text-anchor="middle" fill="#3e4c59">${esc(lb)}</text>`}});
  if(line){const pts=line.vals.map((v,i)=>`${L+gw*i+gw/2},${yy(v)}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${line.c}" stroke-width="2"/>`;
    if(n<=40)line.vals.forEach((v,i)=>s+=`<circle cx="${L+gw*i+gw/2}" cy="${yy(v)}" r="3" fill="${line.c}"/>`)}
  let lx=L;const leg=[...series.map(x=>[x.name,x.c,'r']),...(line?[[line.name,line.c,'l']]:[])];
  leg.forEach(([nm,c,t])=>{s+=t==='r'?`<rect x="${lx}" y="8" width="11" height="11" fill="${c}" rx="2"/>`:`<line x1="${lx}" x2="${lx+12}" y1="13.5" y2="13.5" stroke="${c}" stroke-width="2.5"/>`;s+=`<text x="${lx+16}" y="18" fill="#1f2933">${esc(nm)}</text>`;lx+=nm.length*6.4+36});
  return s+'</svg>';
}

function runTest(t,quiet){

  catch(e){S.err[t.id]=e.message||String(e);delete S.results[t.id]}
}

function mulberry(a){a=a>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function efFor(cl){const c=Math.round(cl*100);let f=1.3;for(const k of [80,85,90,95,99])if(c>=k)f=EFT[k];return f}
function poisCdf(k,l){let t=Math.exp(-l),s=t;for(let i=1;i<=k;i++){t*=l/i;s+=t}return s}
function poisUL(k,cl){let lo=0,hi=300;for(let i=0;i<120;i++){const m=(lo+hi)/2;if(poisCdf(k,m)>1-cl)lo=m;else hi=m}return hi}
function binCdf(k,n,p){if(p<=0)return 1;if(p>=1)return k>=n?1:0;let t=Math.pow(1-p,n),s=t;for(let i=1;i<=k;i++){t*=(n-i+1)/i*p/(1-p);s+=t}return s}

function SP_DEF(){return{src:'all',srcTest:'',sign:'all',amtMin:'',amtMax:'',dFrom:'',dTo:'',cat:'',party:'',noZero:true,

  method:'mus',seed:newSeed(),order:'file',purpose:'details',qRisk:'moderate',qMethod:'mus',freq:'daily',fRisk:'lower',sBasis:'value',sBands:(S.params.strat&&S.params.strat.b)||'10000, 50000, 100000, 500000, 1000000',sAlloc:'value',sMin:2,sCustom:'',proj:'ratio'}}
const SIA5={annual:[1,1,'Annual'],quarterly:[2,2,'Quarterly (incl. period-end, i.e. 1+1)'],monthly:[2,3,'Monthly'],weekly:[5,8,'Weekly'],daily:[15,25,'Daily'],multi:[25,40,'Many times a day (recurring manual control)']};

  if(f==='quarterly'){const m=+d.slice(5,7);return fyOf(d)+'-Q'+(Math.floor(((m+8)%12)/3)+1)}

  if(f==='monthly')return MN[+k.slice(5,7)-1]+' '+k.slice(0,4);if(f==='daily')return dmy(k);if(f==='weekly')return 'Week starting '+dmy(k);if(f==='annual')return fy(k.slice(2));

function spSet(k,v){const p=S.samp.p;p[k]=v;
  if(k==='purpose'){if(v==='controls'){Object.assign(p,{sizeMode:'sia5',keyOn:false,keyTests:[],method:p.freq==='multi'?'random':'period'})}else Object.assign(p,{sizeMode:'mus',keyOn:true,method:'mus',cl:QCL[p.qRisk]})}
  if(k==='qRisk')p.cl=QCL[v];
  if(k==='sizeMode'&&v==='interval')p.method='mus';
  if(k==='method'&&v!=='mus'&&p.sizeMode==='interval')p.sizeMode='manual'}
function spHook(k,before){const p=S.samp.p;
  if(k==='tm'&&p.keyFollow)p.keyAmt=p.tm;if(k==='keyAmt')p.keyFollow=false;
  if(k==='freq'&&p.purpose==='controls'&&p.sizeMode==='sia5')p.method=p.freq==='multi'?'random':'period';
  if(k==='cl'){const q=Object.keys(QCL).find(x=>QCL[x]===+p.cl);if(q)p.qRisk=q}}
function spPv(){const host=$('#spPv');if(!host)return;const v=spPreview(S.samp.p);
  host.innerHTML=v.err?`<div class="note" style="margin-top:12px">${esc(v.err)}</div>`:`<div class="pv"><div>Population<b>${fmt0(v.pop)}</b>₹${fmt(v.pv)}</div><div>Key items (checked in full)<b>${fmt0(v.k)}</b>₹${fmt(v.kv)}</div><div>Sample<b>${fmt0(v.n)} ${v.unit==='items'?'':esc(v.unit)}</b>${v.cap?'all remaining items':'to be picked'}</div><div>Total to test<b>${v.unit==='items'?fmt0(v.n+v.k):fmt0(v.n)+' '+esc(v.unit)+(v.k?' + '+fmt0(v.k):'')}</b>&nbsp;</div><div style="flex:1 1 300px">How the size is worked out<span style="display:block;color:var(--ink);font-size:12.5px;margin-top:2px">${esc(v.txt||'—')}</span></div></div>`}
function spRead(){const p=S.samp.p;document.querySelectorAll('[data-sp]').forEach(e=>{const k=e.dataset.sp;p[k]=e.type==='checkbox'?e.checked:e.value});
  p.keyTests=[...document.querySelectorAll('[data-spk]')].filter(e=>e.checked).map(e=>e.dataset.spk);if(p.seed===''||isNaN(+p.seed))p.seed=newSeed()}

function spList(){const R=S.samp.res,A=S.samp.audit,cols=txnCols().filter(c=>c.k!=='_desc'),host=$('#spList');

  <div class="muted" style="margin-bottom:8px">Enter the audited (correct) value for each item after vouching. Leave the book value if the item is correct. You can also paste two columns from Excel — S.No. and Audited value — in the box below the table.</div>
  <div class="tw"><table><thead><tr><th class="r">S.No.</th><th>Type</th><th>Selection basis</th>${R.method==='strat'?'<th>Stratum</th>':''}${cols.map(c=>`<th class="${T[c.t]?'r':''}">${esc(c.h)}</th>`).join('')}<th class="r">Audited value</th><th class="r">Misstatement</th></tr></thead><tbody>`;

    <td class="r"><input data-av="${x._r}" value="${esc(av)}" placeholder="${esc(fmt(x._amt))}" style="width:130px;text-align:right"></td><td class="r" data-dv="${x._r}" style="${d?'color:var(--red);font-weight:600':''}">${d==null?'':fmt(d)}</td></tr>`});
  h+=`</tbody></table></div><div class="row" style="margin-top:10px"><textarea id="spPaste" rows="3" style="flex:1;min-width:280px" placeholder="Paste from Excel: S.No. [tab] Audited value — one item per line"></textarea><button class="btn" id="spPasteGo">Apply pasted values</button></div>`;

}
function spListCtl(){const R=S.samp.res,host=$('#spList');S.samp.dev=S.samp.dev||{};S.samp.rem=S.samp.rem||{};const D=S.samp.dev,M=S.samp.rem;

  $('#spClearC').onclick=()=>{S.samp.dev={};spListCtl();spRenderEval()};
  $('#spCopy').onclick=()=>copyText(tsv(spCols(),R.items.map(spRowOut)))}
function ctlEval(){const R=S.samp.res,p=S.samp.p,D=S.samp.dev||{};const all=R.items.length,t=R.items.filter(x=>D[String(x._r)]),dev=t.filter(x=>D[String(x._r)]==='dev').length;if(!t.length)return null;
  const ev={ctl:true,n:t.length,all,dev,rate:dev/t.length,notes:[]};if(t.length<all)ev.notes.push(fmt0(all-t.length)+' of '+fmt0(all)+' selected items are not yet tested.');
  if(p.sizeMode==='attr'){const cl=R.cl,tdr=(+p.tdr||0)/100;let lo=0,hi=1;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(binCdf(dev,t.length,m)>1-cl)lo=m;else hi=m}ev.udl=hi;ev.tdr=tdr;
    ev.concl=hi<=tdr?['Upper deviation limit of '+pct(hi)+' (at '+(cl*100)+'% confidence) is within the tolerable deviation rate of '+pct(tdr)+'. The sample supports reliance on the control as planned.','ok']:['Upper deviation limit of '+pct(hi)+' (at '+(cl*100)+'% confidence) exceeds the tolerable deviation rate of '+pct(tdr)+'. The control cannot be relied on as planned; revise the risk assessment and extend substantive work (SA 330, SA 265).','bad']}
  else ev.concl=dev===0?['No deviations in the '+fmt0(t.length)+' items tested. The sample supports reliance on the control as planned.','ok']:['Deviations found: '+dev+' of '+fmt0(t.length)+' ('+pct(dev/t.length)+'). The minimum sample sizes assume no deviations, so the control cannot be relied on as planned unless the deviation is shown to be an isolated exception. Consider extending the sample or testing a compensating control, and revise the risk assessment (SA 330, SA 265).','bad'];
  return ev}
function spCols(){const R=S.samp.res;if(R.purpose==='controls')return[{k:'_sno',h:'S.No.',t:'int'},{k:'_how',h:'Selection basis'},...(R.periods?[{k:'_period',h:'Period'},{k:'_pn',h:'Transactions',t:'int'},{k:'_pv',h:'Value',t:'amt'}]:txnCols()),{k:'_res',h:'Result'},{k:'_rem',h:'Remarks / evidence seen'}];return[{k:'_sno',h:'S.No.',t:'int'},{k:'_type',h:'Type'},{k:'_how',h:'Selection basis'},...(R.method==='strat'?[{k:'_st',h:'Stratum'}]:[]),...txnCols(),{k:'_av',h:'Audited value',t:'amt'},{k:'_mis',h:'Misstatement',t:'amt'},{k:'_rem',h:'Remarks / evidence seen'}]}
function spRowOut(x){if(S.samp.res.purpose==='controls'){const k=String(x._r),D=S.samp.dev||{},M=S.samp.rem||{};return Object.assign({},x,{_res:{ok:'Operated',dev:'Deviation'}[D[k]]||'',_rem:M[k]||''})}const A=S.samp.audit,a=parseAmount(A[x._r]),has=A[x._r]!==undefined&&String(A[x._r]).trim()!==''&&a!=null;return Object.assign({},x,{_av:has?a:null,_mis:has?x._amt-a:null,_rem:''})}
function spRenderEval(){const host=$('#spEval');if(!host)return;const R=S.samp.res;
  if(R.purpose==='controls'){const ev=ctlEval();S.samp.ev=ev;if(!ev){host.innerHTML=`<div class="card"><h3>Evaluation</h3><div class="muted">Record the result of each item above. The evaluation appears here as you go.</div></div>`;return}
    let h=`<div class="card"><h3>Evaluation of results</h3>`;ev.notes.forEach(n=>h+=`<div class="note">${esc(n)}</div>`);
    h+=`<div class="cards">${[['Items tested',fmt0(ev.n)+' of '+fmt0(ev.all)],['Deviations',fmt0(ev.dev),ev.dev?'bad':'ok'],['Sample deviation rate',pct(ev.rate)],...(ev.udl!=null?[['Upper deviation limit',pct(ev.udl),ev.udl>ev.tdr?'bad':'ok'],['Tolerable deviation rate',pct(ev.tdr)]]:[])].map(kpi).join('')}</div>
      <div class="${ev.concl[1]==='ok'?'help':'err'}"><b>Indicated result:</b> ${esc(ev.concl[0])}</div><p class="muted" style="margin-top:8px">For tests of controls, the deviation rate found in the sample is itself the projected rate for the population.</p></div>`;host.innerHTML=h;return}
  const ev=spEval();
  if(!ev){host.innerHTML=`<div class="card"><h3>Evaluation</h3><div class="muted">Enter audited values in the table above. The projection of misstatements to the population appears here as you go.</div></div>`;return}
  let h=`<div class="card"><h3>Evaluation of results</h3>`;ev.notes.forEach(n=>h+=`<div class="note">${esc(n)}</div>`);
  const c=[['Items tested',fmt0(ev.nKey+ev.nS)+' of '+fmt0(ev.nKeyAll+ev.nSAll)],['Actual misstatement in key items',fmt(ev.keyMis),ev.keyMis?'warn':'ok']];
  if(R.method==='mus'){c.push(['Projected misstatement (sample)',fmt(ev.proj),ev.proj?'warn':'ok'],['Basic precision (RF × interval)',fmt(ev.bp)],['Incremental allowance',fmt(ev.inc)],['Upper misstatement limit (sample)',fmt(ev.uml),ev.tm&&ev.uml>=ev.tm?'bad':''],['Understatements found (projected)',fmt(ev.under)])}
  else c.push(['Projected misstatement (sample)',fmt(ev.proj),ev.proj?'warn':'ok']);
  c.push(['Total: key items + projection',fmt(ev.total),ev.total?'warn':'ok'],['Tolerable misstatement',ev.tm?fmt(ev.tm):'Not entered']);
  h+=`<div class="cards">${c.map(kpi).join('')}</div>`;
  if(ev.concl)h+=`<div class="${ev.concl[1]==='ok'?'help':'err'}" style="margin-bottom:12px"><b>Indicated result:</b> ${esc(ev.concl[0])}</div>`;else h+=`<div class="muted" style="margin-bottom:12px">Enter tolerable misstatement in step 4 to compare the result.</div>`;
  if(R.method==='mus')h+=`<div class="muted" style="margin-bottom:10px">Upper misstatement limit = basic precision + projected overstatements (taintings × interval) + incremental allowance for each ranked tainting + actual misstatement in items at or above the interval. Key items are added separately, at their actual misstatement. Confidence ${(R.cl*100).toFixed(1)}%.</div>`;
  h+=`<div id="spEvT"></div>${ev.strata?'<div id="spEvS" style="margin-top:12px"></div>':''}</div>`;host.innerHTML=h;
  const rows=ev.rows.filter(o=>Math.abs(o.dd)>0.004).map(o=>Object.assign({},o.x,{_dd:o.dd,_t:o.t,_pm:o.pm,_note:o.note}));
  renderTable($('#spEvT'),{title:'Misstatements found',cols:[{k:'_sno',h:'S.No.',t:'int'},{k:'_type',h:'Type'},...txnCols(),{k:'_dd',h:'Misstatement',t:'amt'},...(R.method==='mus'?[{k:'_t',h:'Tainting',t:'pct'},{k:'_pm',h:'Projected',t:'amt'}]:[]),{k:'_note',h:'Note'}],rows});
  if(ev.strata)renderTable($('#spEvS'),{title:'Projection by stratum',cols:[{k:'lab',h:'Stratum'},{k:'n',h:'Sample',t:'int'},{k:'t',h:'Tested',t:'int'},{k:'mis',h:'Misstatement found',t:'amt'},{k:'proj',h:'Projected to stratum',t:'amt'}],rows:ev.strata,noSort:true});
  S.samp.ev=ev}
function spRowsLeft(R){const keys=new Set(R.items.filter(x=>x._type==='Key').map(x=>x._r));try{return spPopulation(S.samp.p).filter(r=>!keys.has(r._r))}catch(e){return[]}}
function spExport(wb){const R=S.samp&&S.samp.res;if(!R)return;
  const a=[['Audit sampling plan (SA 530)'],[],...R.plan,[],['Population',R.pop.n+' items',Math.round(R.pop.v*100)/100],['Key items',R.key.n+' items',Math.round(R.key.v*100)/100],['Left to sample',R.sp.n+' items',Math.round(R.sp.v*100)/100],['Sample size planned',R.nPlan],['Items selected (incl. key items)',R.items.length]];
  if(R.J)a.push([R.method==='mus'?'Sampling interval (₹)':'Interval (items)',Math.round(R.J*100)/100],[R.method==='mus'?'Random start (₹)':'Random start',Math.round(R.start*100)/100]);
  if(R.strata){a.push([],['Stratum','Items','Value','Sample size','Sample value']);R.strata.forEach(s=>a.push([s.lab,s.N,Math.round(s.V*100)/100,s.n,Math.round(s.nv*100)/100]))}
  if(R.purpose==='controls'){const e=ctlEval();if(e){a.push([],['Evaluation'],['Items tested',e.n],['Deviations',e.dev],['Sample deviation rate',Math.round(e.rate*1e4)/1e4]);if(e.udl!=null)a.push(['Upper deviation limit',Math.round(e.udl*1e4)/1e4],['Tolerable deviation rate',e.tdr]);a.push(['Indicated result',e.concl[0]])}}
  const ev=R.purpose==='controls'?null:spEval();if(ev){a.push([],['Evaluation'],['Items tested',ev.nKey+ev.nS],['Actual misstatement in key items',Math.round(ev.keyMis*100)/100],['Projected misstatement (sample)',Math.round(ev.proj*100)/100]);
    if(R.method==='mus')a.push(['Basic precision',Math.round(ev.bp*100)/100],['Incremental allowance',Math.round(ev.inc*100)/100],['Upper misstatement limit (sample)',Math.round(ev.uml*100)/100]);
    a.push(['Total (key items + projection)',Math.round(ev.total*100)/100],['Tolerable misstatement',ev.tm||''],['Indicated result',ev.concl?ev.concl[0]:'']);ev.notes.forEach(n=>a.push(['Note',n]))}
  const w1=XLSX.utils.aoa_to_sheet(a);w1['!cols']=[{wch:34},{wch:90},{wch:18}];XLSX.utils.book_append_sheet(wb,w1,'Sampling plan');
  const cols=spCols();const b=[cols.map(c=>c.h),...R.items.map(spRowOut).map(x=>cols.map(c=>xval(x[c.k],c.t)))];
  const w2=XLSX.utils.aoa_to_sheet(b);w2['!cols']=cols.map(()=>({wch:16}));XLSX.utils.book_append_sheet(wb,w2,'Sample')}

/* ============ Export ============ */
function exportWB(ids){
  ids=ids||TESTS.map(t=>t.id).filter(id=>S.results[id]);
  const hasS=!!(S.samp&&S.samp.res);if(!ids.length&&!hasS){toast('Run at least one test or select a sample first');return}
  const wb=XLSX.utils.book_new();const now=new Date();
  const info=[['CAAT Tools — Data analytics working paper'],['Disclaimer: '+DISCLAIMER],[],['Entity',$('#eEnt').value],['Period',$('#ePer').value],['Prepared by',$('#ePrep').value],['Date of preparation',now.toLocaleString('en-IN')],
    ['Source file',S.fileName],['Sheet',S.sheet],['Records analysed',S.rows.length],['Amounts read',valid().length],['SHA-256 of source file',S.hash],
    ...dataLogLines(),['Amounts',S.amtMode==='split'?'Debit = '+S.map.amount+'; Credit = '+S.map.credit+'; amount = Debit − Credit'+(S.splitPos==='cr'?' (credits shown positive)':''):S.amtMode==='ind'?'Amount = '+S.map.amount+'; Dr/Cr column = '+S.map.drcr+'; '+(S.drcrNeg==='cr'?'Cr':'Dr')+' treated as negative':'Amount = '+S.map.amount],
    ['Other columns',MAPF.filter(([k])=>S.map[k]&&!['amount','credit','drcr'].includes(k)).map(([k,l])=>l+' = '+S.map[k]).join('; ')],['Absolute values',S.abs?'Yes':'No'],[],['Test','Key result','Parameters','Reviewed by / remarks']];
  ids.forEach(id=>{const r=S.results[id];info.push([TBYID[id].name,r.cards.map(c=>c[0]+': '+c[1]).join(' | '),r.params,''])});
  const ws0=XLSX.utils.aoa_to_sheet(info);ws0['!cols']=[{wch:28},{wch:70},{wch:60},{wch:30}];XLSX.utils.book_append_sheet(wb,ws0,'Summary');
  const used=new Set(['Summary']);
  ids.forEach(id=>{const t=TBYID[id],r=S.results[id];const a=[[t.name],['Parameters: '+r.params],[]];r.cards.forEach(c=>a.push([c[0],c[1]]));a.push([]);
    r.tables.forEach(tb=>{a.push([tb.title]);a.push(tb.cols.map(c=>c.h));tb.rows.forEach(x=>a.push(tb.cols.map(c=>xval(x[c.k],c.t))));a.push([])});
    let nm=t.name.replace(/[\\\/\?\*\[\]:']/g,'').slice(0,31);while(used.has(nm))nm=nm.slice(0,28)+'_'+used.size;used.add(nm);
    const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=Array(12).fill({wch:16});XLSX.utils.book_append_sheet(wb,ws,nm)});
  if(hasS&&(arguments[0]===undefined))spExport(wb);
  const fn='CAAT_'+(($('#eEnt').value||'Analysis').replace(/[^\w]+/g,'_'))+'_'+now.toISOString().slice(0,10)+'.xlsx';
  try{XLSX.writeFile(wb,fn);toast('Working papers exported: '+fn)}catch(e){toast('Download blocked here — use the offline copy of the tool')}
}
$('#bExport').onclick=()=>exportWB();
['eEnt','ePer','ePrep'].forEach(id=>{try{const v=localStorage.getItem('caat_'+id);if(v)$('#'+id).value=v}catch(e){}$('#'+id).oninput=e=>{try{localStorage.setItem('caat_'+id,e.target.value)}catch(_){}}});
/* Desktop (Electron) bridge — inactive in a normal browser */
if(window.caatDesktop){try{
  caatDesktop.onOpenFiles(list=>{S.view='data';addFiles(list.map(f=>new File([f.data],f.name)))});
  caatDesktop.onNavigate(v=>{if(v==='data'||S.mapped){S.view=v;render();window.scrollTo(0,0)}else toast('Load data and apply mapping first')});
  caatDesktop.onExport(()=>exportWB());
}catch(e){}}
render();
</script>
